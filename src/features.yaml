---
foreman:
  description: Base Foreman Server
foreman-proxy:
  description: Base Foreman Proxy
hammer:
  description: Foreman CLI
katello:
  description: Content and Subscription Management plugin for Foreman
  foreman:
    plugin_name: katello
  hammer: katello
  dependencies:
    - tasks
google:
  description: Google Compute Engine plugin for Foreman
  hammer: foreman_google
  foreman:
    plugin_name: foreman_google
azure-rm:
  description: Azure Resource Manager plugin for Foreman
  hammer: foreman_azure_rm
  foreman:
    plugin_name: foreman_azure_rm
tasks:
  description: Tasks management engine for Foreman
  foreman:
    plugin_name: foreman-tasks
  hammer: foreman_tasks
  internal: true
  dependencies:
    - dynflow
remote-execution:
  description: Remote Execution plugin for Foreman
  foreman:
    plugin_name: foreman_remote_execution
  foreman_proxy:
    plugin_name: remote_execution_ssh
  hammer: foreman_remote_execution
  dependencies:
    - tasks
dynflow:
  internal: true
  foreman_proxy:
    plugin_name: dynflow
rh-cloud:
  description: Connection to Red Hat Cloud
  foreman:
    plugin_name: foreman_rh_cloud
  hammer: foreman_rh_cloud
  dependencies:
    - katello
iop:
  description: iop services
  dependencies:
    - rh-cloud
bmc:
  description: Power management for bare metal hosts (IPMI, Redfish)
  foreman_proxy:
    plugin_name: bmc
ansible:
  description: Ansible plugin for Foreman (configuration management)
  foreman:
    plugin_name: foreman_ansible
  hammer: foreman_ansible
  dependencies:
    - tasks
kubevirt:
  description: KubeVirt plugin for Foreman (Kubernetes VM provisioning)
  foreman:
    plugin_name: foreman_kubevirt
  dependencies:
    - katello
puppet:
  description: Puppet/OpenVox integration for configuration management
  foreman:
    plugin_name: foreman_puppet
  foreman_proxy:
    plugin_name: puppet
  hammer: foreman_puppet
discovery:
  description: Bare metal discovery and provisioning
  foreman:
    plugin_name: foreman_discovery
openscap:
  description: Security compliance scanning via OpenSCAP
  foreman:
    plugin_name: foreman_openscap
webhooks:
  description: Webhook event notifications
  foreman:
    plugin_name: foreman_webhooks
templates:
  description: Template sync with Git repositories
  foreman:
    plugin_name: foreman_templates
virt-who:
  description: virt-who hypervisor configuration
  foreman:
    plugin_name: foreman_virt_who_configure
leapp:
  description: RHEL upgrade planning via Leapp
  foreman:
    plugin_name: foreman_leapp
  dependencies:
    - remote-execution
bootdisk:
  description: Boot disk provisioning
  foreman:
    plugin_name: foreman_bootdisk
